services:

  # ==========================================================================
  # OSGi Application (Apache Karaf with OpenTelemetry features)
  # ==========================================================================
  osgi-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: osgi-app
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=osgi-demo
    depends_on:
      - otel-collector
    networks:
      - otel-network

  # ==========================================================================
  # OpenTelemetry Collector (Gateway)
  # Receives OTLP from the OSGi app and routes to backends
  # ==========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
    networks:
      - otel-network

  # ==========================================================================
  # Grafana Tempo (Distributed Tracing Backend)
  # ==========================================================================
  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - otel-network

  # ==========================================================================
  # Prometheus (Metrics Backend)
  # Scrapes metrics from the OTel Collector's Prometheus exporter
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9080:9080"
    networks:
      - otel-network

  # ==========================================================================
  # Grafana Loki (Log Aggregation Backend)
  # ==========================================================================
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - otel-network

  # ==========================================================================
  # Grafana (Observability UI)
  # Pre-configured with Tempo, Prometheus, and Loki data sources
  # ==========================================================================
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    networks:
      - otel-network

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  otel-network:
    driver: bridge
