# OpenTelemetry OSGi Runtime Configuration
#
# Place this file in ${karaf.etc}/ as:
#   org.eclipse.osgi.technology.incubator.opentelemetry.runtime.cfg
#
# Or install the opentelemetry-osgi feature which includes sensible defaults.
# This example file shows all available configuration options.

# Service name reported in all telemetry data.
# Overridden by the OTEL_SERVICE_NAME environment variable if set.
serviceName = osgi-application

# Service version reported as a resource attribute.
serviceVersion = 0.1.0

# Service namespace for logical grouping.
# serviceNamespace =

# Exporter type: "logging" (stdout) or "otlp" (OTLP/gRPC to a collector).
# Automatically switches to "otlp" when OTEL_EXPORTER_OTLP_ENDPOINT env var is set.
exporterType = logging

# OTLP collector endpoint (only used when exporterType=otlp).
otlpEndpoint = http://localhost:4317

# Additional resource attributes as key=value pairs.
# Example: additionalResourceAttributes = deployment.environment=production,host.name=myhost
# additionalResourceAttributes =
