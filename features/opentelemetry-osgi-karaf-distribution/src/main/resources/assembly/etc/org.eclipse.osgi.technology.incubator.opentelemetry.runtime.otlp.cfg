# OpenTelemetry OTLP Exporter Configuration
#
# Activates the OTLP/HTTP exporter for sending telemetry to a collector.
# The endpoint and service name can be overridden via environment variables:
#   OTEL_EXPORTER_OTLP_ENDPOINT — overrides otlpEndpoint
#   OTEL_SERVICE_NAME — overrides serviceName

serviceName = osgi-application
serviceVersion = 0.1.0
otlpEndpoint = http://localhost:4318
