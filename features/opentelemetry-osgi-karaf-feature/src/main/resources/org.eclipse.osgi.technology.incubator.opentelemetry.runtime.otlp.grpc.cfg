# OpenTelemetry OTLP/gRPC Exporter Configuration
#
# Place this file in ${karaf.etc}/ as:
#   org.eclipse.osgi.technology.incubator.opentelemetry.runtime.otlp.grpc.cfg
#
# This configuration activates the OTLP/gRPC exporter for sending telemetry
# to an OpenTelemetry Collector or compatible backend.

# Service name reported in all telemetry data.
# Overridden by the OTEL_SERVICE_NAME environment variable if set.
serviceName = osgi-application

# Service version reported as a resource attribute.
serviceVersion = 0.1.0

# Service namespace for logical grouping.
# serviceNamespace =

# OTLP/gRPC collector endpoint. Unlike HTTP, gRPC uses a single endpoint for all signals.
# Overridden by the OTEL_EXPORTER_OTLP_ENDPOINT environment variable if set.
endpoint = http://localhost:4317

# Export timeout in milliseconds (default: 10000).
# timeout = 10000

# Connection timeout in milliseconds (default: 10000).
# connectTimeout = 10000

# Compression: "none" (default) or "gzip".
# compression = none

# Additional gRPC metadata headers as key=value pairs.
# headers = Authorization=Bearer my-token

# Metric aggregation temporality: "cumulative" (default) or "delta".
# aggregationTemporality = cumulative

# TLS: trusted CA certificates (PEM file path).
# trustedCertificatesPath =

# TLS: client certificate for mTLS (PEM file path).
# clientCertificatePath =

# TLS: client private key for mTLS (PKCS#8 PEM file path).
# clientKeyPath =

# Additional resource attributes as key=value pairs.
# additionalResourceAttributes =
